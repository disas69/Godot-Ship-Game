name: Deploy Web Build to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true

      - name: Create Web Export Directory
        run: mkdir -v -p builds/web

      - name: Godot Web Export
        run: godot --headless --verbose --export-release "Web" builds/web/index.html

      - name: Add Cross-Origin Isolation (coi-serviceworker) for GitHub Pages
        run: |
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/gzguidotti/coi-serviceworker/main/coi-serviceworker.js', 'builds/web/coi-serviceworker.js')"
          sed -i 's/<head>/<head><script src="coi-serviceworker.js"><\/script>/g' builds/web/index.html

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds/web
          publish_branch: gh-pages
          force_orphan: true
